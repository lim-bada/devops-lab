# devops-lab/app 의 CI: test → bootJar → artifact 업로드.
# 저장소 루트의 .github/workflows/ 에 복사해서 쓴다.
name: app-ci

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/ci.yml"]   # 이 파일을 처음 올릴 때도 실행된다
  pull_request:
    branches: [main]
    paths: ["app/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            app/*.gradle*
            app/gradle/wrapper/gradle-wrapper.properties
      - name: Test
        run: ./gradlew test --no-daemon
      - name: Build jar
        run: ./gradlew bootJar --no-daemon
      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: app/build/libs/app.jar
          retention-days: 7
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: app/build/reports/tests/test/
