# 가장 작은 workflow. main 에 push 하면 한 번 돈다.
name: hello-actions

on:
  push:
    branches: [main]

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Print message
        run: echo "Hello GitHub Actions"
      - name: Show context
        run: |
          echo "event  = ${{ github.event_name }}"
          echo "branch = ${{ github.ref_name }}"
          echo "actor  = ${{ github.actor }}"
